[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.coverage.run]
source = ["users", "habits", "notifications"]
omit = ["*/migrations/*", "*/tests/*", "*/admin.py", "*/apps.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
